# Cargo configuration for the workspace
# Workspace-level lint settings should be controlled in the code or via CI, not by globally
# suppressing unused-code warnings here.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "split-debuginfo=unpacked",
]
